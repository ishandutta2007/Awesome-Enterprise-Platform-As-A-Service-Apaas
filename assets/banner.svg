nsform:translateY(0)}50%{transform:translateY(10px)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes beaconPulse{0%{r:4;opacity:1}50%{r:7;opacity:.4}}.pulse-orb-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:200px 100px}.pulse-orb-2{animation:pulseGlow 10s ease-in-out infinite 2s;transform-origin:1000px 280px}.pulse-orb-3{animation:pulseGlow 7s ease-in-out infinite 1s;transform-origin:600px 330px}.float-item-1{animation:floatCardSlow 6s ease-in-out infinite}.float-item-2{animation:floatCardReverse 7s ease-in-out infinite .5s}.float-item-3{animation:floatCardSlow 6.5s ease-in-out infinite 1.2s}.float-item-4{animation:floatCardReverse 8s ease-in-out infinite 2s}.animated-wire{stroke-dasharray:20,15;animation:flowLine 14s linear infinite}.beacon{animation:beaconPulse 2.5s ease-in-out infinite}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:900;letter-spacing:-.5px}.mono-pill{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.6px}.sub-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:400}</style><rect width="100%" height="100%" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" rx="16"/><g opacity=".6"><circle cx="200" cy="90" r="140" fill="#3b82f6" class="pulse-orb-1" filter="url(#glowEffect)" opacity=".3"/><circle cx="1020" cy="270" r="160" fill="#8b5cf6" class="pulse-orb-2" filter="url(#glowEffect)" opacity=".3"/><circle cx="600" cy="340" r="110" fill="#06b6d4" class="pulse-orb-3" filter="url(#glowEffect)" opacity=".2"/></g><g stroke="#94a3b8" stroke-width=".75" opacity=".12"><line x1="0" x2="1200" y1="60" y2="60" stroke-dasharray="6 6"/><line x1="0" x2="1200" y1="130" y2="130" stroke-dasharray="6 6"/><line x1="0" x2="1200" y1="200" y2="200" stroke-dasharray="6 6"/><line x1="0" x2="1200" y1="270" y2="270" stroke-dasharray="6 6