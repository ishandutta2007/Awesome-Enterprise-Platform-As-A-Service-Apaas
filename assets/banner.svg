<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic Animation Keyframes */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }

    @keyframes floatCardSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatCardReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }

    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes beaconPulse {
      0%, 100% { r: 4; opacity: 1; }
      50% { r: 7; opacity: 0.4; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 10s ease-in-out infinite 2s;
      transform-origin: 1000px 280px;
    }
    .pulse-orb-3 {
      animation: pulseGlow 7s ease-in-out infinite 1s;
      transform-origin: 600px 330px;
    }

    .float-item-1 { animation: floatCardSlow 6s ease-in-out infinite; }
    .float-item-2 { animation: floatCardReverse 7s ease-in-out infinite 0.5s; }
    .float-item-3 { animation: floatCardSlow 6.5s ease-in-out infinite 1.2s; }
    .float-item-4 { animation: floatCardReverse 8s ease-in-out infinite 2s; }

    .animated-wire {
      stroke-dasharray: 20, 15;
      animation: flowLine 14s linear infinite;
    }

    .beacon {
      animation: beaconPulse 2.5s ease-in-out infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
    }

    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Animated Glowing Ambience in Background -->
  <g opacity="0.6">
    <circle class="pulse-orb-1" cx="200" cy="90" r="140" fill="#3b82f6" opacity="0.3" filter="url(#glowEffect)" />
    <circle class="pulse-orb-2" cx="1020" cy="270" r="160" fill="#8b5cf6" opacity="0.3" filter="url(#glowEffect)" />
    <circle class="pulse-orb-3" cx="600" cy="340" r="110" fill="#06b6d4" opacity="0.2" filter="url(#glowEffect)" />
  </g>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="6,6" />
    <line x1="0" y1="130" x2="1200" y2="130" stroke-dasharray="6,6" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="6,6" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="6,6" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke-dasharray="6,6" />
    
    <line x1="150" y1="0" x2="150" y2="380" stroke-dasharray="6,6" />
    <line x1="380" y1="0" x2="380" y2="380" stroke-dasharray="6,6" />
    <line x1="600" y1="0" x2="600" y2="380" stroke-dasharray="6,6" />
    <line x1="820" y1="0" x2="820" y2="380" stroke-dasharray="6,6" />
    <line x1="1050" y1="0" x2="1050" y2="380" stroke-dasharray="6,6" />
  </g>

  <!-- Flowing Architectural Wires (Background Level) -->
  <g fill="none">
    <path class="animated-wire" d="M 50,190 C 220,130 350,260 550,190 C 750,120 920,240 1150,180" stroke="url(#cyanGlow)" stroke-width="2" />
    <path class="animated-wire" d="M 80,310 C 260,350 420,240 640,300 C 860,360 980,270 1120,320" stroke="url(#purpleGlow)" stroke-width="1.8" />
  </g>

  <!-- Background Animated Pill Cards (Stay away from center text zone) -->
  <!-- Left Side Badges -->
  <g class="float-item-1">
    <rect x="55" y="42" width="175" height="34" rx="8" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="73" cy="59" r="4.5" fill="#38bdf8" class="beacon"/>
    <text x="88" y="63" fill="#e2e8f0" class="mono-pill">⚡ LOW-CODE / NO-CODE</text>
  </g>

  <g class="float-item-2">
    <rect x="40" y="295" width="185" height="34" rx="8" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="58" cy="312" r="4.5" fill="#a855f7" class="beacon"/>
    <text x="73" y="316" fill="#e2e8f0" class="mono-pill">🛡️ ENTERPRISE GOVERNANCE</text>
  </g>

  <!-- Right Side Badges -->
  <g class="float-item-3">
    <rect x="965" y="42" width="180" height="34" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="983" cy="59" r="4.5" fill="#10b981" class="beacon"/>
    <text x="998" y="63" fill="#e2e8f0" class="mono-pill">🤖 AI AGENTS &amp; APIS</text>
  </g>

  <g class="float-item-4">
    <rect x="975" y="295" width="170" height="34" rx="8" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="993" cy="312" r="4.5" fill="#f43f5e" class="beacon"/>
    <text x="1008" y="316" fill="#e2e8f0" class="mono-pill">🌐 MODEL-DRIVEN aPaaS</text>
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND HERO CONTENT (GUARANTEED MAXIMUM VISIBILITY) -->
  <!-- ======================================================== -->
  
  <!-- Subtle Backing Glow strictly behind hero text to maintain contrast -->
  <rect x="230" y="70" width="740" height="215" rx="20" fill="#030712" fill-opacity="0.6" filter="url(#softGlow)" />

  <!-- Super Tag / Category Chip -->
  <g>
    <rect x="495" y="85" width="210" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="600" y="102" fill="#a5b4fc" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <g>
    <text x="600" y="165" text-anchor="middle" fill="url(#primaryTextGrad)" class="title-text" font-size="44" filter="url(#softGlow)">AWESOME ENTERPRISE aPaaS</text>
    <text x="600" y="165" text-anchor="middle" fill="url(#primaryTextGrad)" class="title-text" font-size="44">AWESOME ENTERPRISE aPaaS</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="208" text-anchor="middle" fill="#e2e8f0" class="sub-text" font-size="17" letter-spacing="0.2">
    The Definitive Platform-as-a-Service Guide: SaaS Titans &amp; Self-Hosted Open-Source Engines
  </text>

  <text x="600" y="234" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="13">
    Empowering Citizen Developers, Enterprise Architects &amp; Modern Engineering Teams
  </text>

  <!-- Bottom Interactive Categories Bar -->
  <g transform="translate(325, 258)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
    <text x="62" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🏢 SaaS Titans</text>
    
    <!-- Pill 2 -->
    <rect x="140" y="0" width="135" height="26" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
    <text x="207" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🚀 Open Source</text>
    
    <!-- Pill 3 -->
    <rect x="290" y="0" width="125" height="26" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
    <text x="352" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚙️ Low-Code / BPM</text>

    <!-- Pill 4 -->
    <rect x="430" y="0" width="125" height="26" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
    <text x="492" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🤖 AI Automation</text>
  </g>
</svg>
